      const [countdown, setCountdown] = useState(6480);

      useEffect(() => {
        const timer = setInterval(() => setCountdown(p => (p > 0 ? p - 1 : 0)), 1000);
        return () => clearInterval(timer);
      }, []);

      const formatCountdown = (s) => {
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = s % 60;
        return `${h}h ${m}m ${sec < 10 ? '0' : ''}${sec}s`;
      };

      const allJobs = jobs || MOCK_CONTRACTOR_JOBS;
      const activeJobsList = allJobs.filter(j => j.status !== 'PAID & CLOSED');
      const criticalCount = activeJobsList.filter(j => j.priority === 'CRITICAL').length;
      const totalEscrow = activeJobsList.reduce((sum, j) => {
        const val = parseInt((j.payout || '12000').replace(/[^0-9]/g, ''), 10) || 12000;
        return sum + val;
      }, 0);

      const filtered = allJobs.filter(j => {
        if (filter === 'critical') return j.priority === 'CRITICAL';
        if (filter === 'standard') return j.priority === 'STANDARD';
        return true;
      });

      return (
        <div className="flex flex-col gap-4 pt-1 pb-28">
          <header className="flex items-center justify-between bg-white p-4 rounded-3xl shadow-sm border border-[#d7e8c3]/80">
            <div className="flex items-center gap-3">
              <img
                src={MOCK_USERS.contractor.avatar}
                alt="Rajesh"
                className="w-12 h-12 rounded-full object-cover ring-2 ring-[#0d631b]"
              />
              <div className="flex flex-col">
                <span className="font-['Plus_Jakarta_Sans'] font-bold text-[16px] text-[#151d19]">
                  {MOCK_USERS.contractor.name}
                </span>
                <div className="flex items-center gap-1.5 text-[11px] font-['Plus_Jakarta_Sans'] text-[#40493d]">
                  <span className="font-semibold text-[#0d631b]">{MOCK_USERS.contractor.crew}</span>
                  <span>•</span>
                  <span>{MOCK_USERS.contractor.company}</span>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-1.5">
              <button
                onClick={() => setLang(lang === 'en' ? 'mr' : 'en')}
                className="px-2.5 py-1 rounded-full text-[12px] font-['Plus_Jakarta_Sans'] font-bold border border-[#2e7d32]/30 bg-[#ecf6ee] text-[#0d631b]"
              >
                {lang === 'en' ? 'मराठी' : 'ENG'}
              </button>
              <button
                onClick={onLogout}
                className="w-9 h-9 rounded-full bg-[#ecf6ee] text-[#ba1a1a] hover:bg-[#ffdad6] flex items-center justify-center transition-colors"
                title={t.logout}
              >
                <span className="material-symbols-outlined text-[20px]">logout</span>
              </button>
            </div>
          </header>

          <section className="grid grid-cols-3 gap-2.5">
            <div className="flex flex-col p-3 rounded-2xl bg-[#ecf6ee] border border-[#d7e8c3]/60 shadow-xs">
              <span className="text-[11px] font-['Plus_Jakarta_Sans'] font-bold text-[#546346] uppercase">Active Jobs</span>
              <span className="font-['Plus_Jakarta_Sans'] text-[22px] font-bold text-[#0d631b] mt-0.5">{activeJobsList.length}</span>
              <span className="text-[10px] text-[#40493d]">Ward 14 & K-West</span>
            </div>

            <div className="flex flex-col p-3 rounded-2xl bg-[#ffdad6]/60 border border-[#ba1a1a]/20 shadow-xs">
              <span className="text-[11px] font-['Plus_Jakarta_Sans'] font-bold text-[#ba1a1a] uppercase flex items-center gap-0.5">
                <span className="material-symbols-outlined text-[13px]">timer</span> Urgent SLA
              </span>
              <span className="font-['Plus_Jakarta_Sans'] text-[22px] font-bold text-[#ba1a1a] mt-0.5">{criticalCount}</span>
              <span className="text-[10px] text-[#93000a]">&lt; 2h Left</span>
            </div>

            <div className="flex flex-col p-3 rounded-2xl bg-[#d7e8c3] border border-[#bfcaba] shadow-xs">
              <span className="text-[11px] font-['Plus_Jakarta_Sans'] font-bold text-[#121f08] uppercase">Queued Escrow</span>
              <span className="font-['Plus_Jakarta_Sans'] text-[18px] font-bold text-[#121f08] mt-1">₹{totalEscrow.toLocaleString('en-IN')}</span>
              <span className="text-[10px] text-[#3d4b30]">Pay-on-Verification</span>
            </div>
          </section>

          <section className="p-4 rounded-3xl bg-[#ba1a1a] text-white shadow-lg flex items-center justify-between gap-3">
            <div className="flex items-center gap-3">

                <span className="material-symbols-outlined text-[22px]">alarm</span>
              </div>
              <div className="flex flex-col">
                <span className="font-['Plus_Jakarta_Sans'] text-[14px] font-bold">{t.urgentSlaWarning}</span>

              </div>

          </section>

          <div className="flex items-center justify-between px-1">
            <h3 className="font-['Plus_Jakarta_Sans'] text-[18px] font-bold text-[#151d19]">
              {t.assignedWorkOrders}

            <div className="flex items-center gap-1.5">
              {['all', 'critical', 'standard'].map(f => (
                <button
                  key={f}
                  onClick={() => setFilter(f)}

                    filter === f ? 'bg-[#0d631b] text-white shadow-xs' : 'bg-[#ecf6ee] text-[#40493d]'
                  }`}
                >
                  {f.toUpperCase()}

              ))}
            </div>
          </div>

          <div className="flex flex-col gap-3">
            {filtered.map(job => (
              <article key={job.id} className="p-4 rounded-3xl bg-white shadow-sm border border-[#d7e8c3]/80 flex flex-col gap-3 hover:border-[#2e7d32] transition-all">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="font-mono text-[12px] font-bold text-[#0d631b] bg-[#ecf6ee] px-2.5 py-0.5 rounded-full">{job.id}</span>
                    <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-['Plus_Jakarta_Sans'] font-bold ${
                      job.priority === 'CRITICAL' ? 'bg-[#ffdad6] text-[#ba1a1a]' : 'bg-[#d7e8c3] text-[#121f08]'

                      {job.priority} SLA

                    {job.status === 'REWORK REQUIRED' && (

                        <span>REWORK REQUIRED</span>
                      </span>

                  <span className="font-['Plus_Jakarta_Sans'] text-[13px] font-bold text-[#0d631b]">{job.payout} Payout</span>
                </div>

                <div className="flex items-start gap-3">
                  <div className="w-20 h-20 rounded-2xl overflow-hidden shrink-0 bg-[#ecf6ee] relative">
                    <img src={job.citizenPhoto} alt={job.title} className="w-full h-full object-cover" />

                  </div>
                  <div className="flex flex-col min-w-0 flex-1">
                    <h4 className="font-['Plus_Jakarta_Sans'] text-[16px] font-bold text-[#151d19] truncate">{job.title}</h4>
                    <p className="font-['Inter'] text-[12px] text-[#40493d] truncate mt-0.5 flex items-center gap-1">

                  </div>
                </div>

                <div className="flex items-center justify-between pt-1 border-t border-[#f2fcf4]">
                  <button
                    type="button"
                    onClick={() => setSpecsJob(job)}
                    className="flex items-center gap-1 text-[12px] font-['Plus_Jakarta_Sans'] font-bold text-[#2e7d32] hover:underline"
                  >
                    <span className="material-symbols-outlined text-[16px]">engineering</span>
                    <span>Specs & Mix</span>
                  </button>

                  <div className="flex items-center gap-2">
                    {job.status === 'VERIFIED & COMPLETED' ? (
                      <span className="px-3.5 py-1.5 rounded-full bg-[#d7e8c3] text-[#0d631b] font-['Plus_Jakarta_Sans'] text-[11px] font-bold flex items-center gap-1 shadow-xs">
                        <span className="material-symbols-outlined text-[15px]">verified</span>
                        <span>AI Verified • Escrow Pending</span>
                      </span>
                    ) : job.status === 'PAID & CLOSED' ? (
                      <span className="px-3.5 py-1.5 rounded-full bg-[#2e7d32] text-white font-['Plus_Jakarta_Sans'] text-[11px] font-bold flex items-center gap-1 shadow-xs">
                        <span className="material-symbols-outlined text-[15px]">task_alt</span>
                        <span>Paid & Closed</span>
                      </span>
                    ) : (
                      <button
                        type="button"
                        onClick={() => {
                          onSelectJob(job);
                          setActiveScreen('contractor-camera');
                        }}
                        className="px-4 py-2 rounded-full bg-[#0d631b] hover:bg-[#2e7d32] text-white font-['Plus_Jakarta_Sans'] text-[13px] font-bold shadow-sm active:scale-95 transition-all flex items-center gap-1.5"
                      >
                        <span className="material-symbols-outlined text-[17px]">photo_camera</span>
                        <span>{t.startRepairProof}</span>
                      </button>
                    )}
                  </div>
                </div>
              </article>
            ))}
          </div>

          {/* Job Specs & Blueprint Modal */}
          {specsJob && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl border border-[#d7e8c3] flex flex-col gap-4 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="font-mono text-[12px] font-bold text-[#0d631b] bg-[#ecf6ee] px-2.5 py-0.5 rounded-full">{specsJob.id}</span>
                    <span className="text-[12px] font-bold text-[#151d19]">Work Order Blueprint</span>
                  </div>
                  <button onClick={() => setSpecsJob(null)} className="w-8 h-8 rounded-full bg-[#ecf6ee] flex items-center justify-center text-[#40493d]">
                    <span className="material-symbols-outlined text-[18px]">close</span>
                  </button>
                </div>

                <div className="w-full h-36 rounded-2xl overflow-hidden relative">
                  <img src={specsJob.citizenPhoto} alt="Site" className="w-full h-full object-cover" />

                  </div>

                    <span className="font-semibold text-[#40493d]">Road Type</span>
                    <span className="font-bold text-[#151d19]">{specsJob.roadClass.split('(')[0]}</span>
                  </div>
                  <div className="flex items-center justify-between p-2.5 rounded-xl bg-[#ecf6ee] text-[12px]">
                    <span className="font-semibold text-[#40493d]">Estimated Depth</span>
                    <span className="font-bold text-[#0d631b]">{specsJob.depth || '4.8 cm'} (Compacted)</span>
                  </div>
                  <div className="flex items-center justify-between p-2.5 rounded-xl bg-[#ecf6ee] text-[12px]">
                    <span className="font-semibold text-[#40493d]">Bitumen Mix Grade</span>
                    <span className="font-bold text-[#151d19]">VG-30 Hot Mix (450 kg)</span>
                  </div>
                  <div className="flex items-center justify-between p-2.5 rounded-xl bg-[#ecf6ee] text-[12px]">
                    <span className="font-semibold text-[#40493d]">Target Camera Heading</span>
                    <span className="font-bold text-[#151d19]">{specsJob.reportedHeading || '284° WNW'}</span>
                  </div>
                  <div className="flex items-center justify-between p-2.5 rounded-xl bg-[#ecf6ee] text-[12px]">
                    <span className="font-semibold text-[#40493d]">Escrow Payout</span>
                    <span className="font-bold text-[#0d631b]">{specsJob.payout} (Released on Auto-Pass)</span>
                  </div>
                </div>

                <button
                  type="button"
                  onClick={() => {
                    onSelectJob(specsJob);
                    setSpecsJob(null);
                    setActiveScreen('contractor-camera');
                  }}
                  className="w-full py-3 rounded-full bg-[#0d631b] hover:bg-[#2e7d32] text-white font-['Plus_Jakarta_Sans'] text-[14px] font-bold shadow-md flex items-center justify-center gap-2"
                >
                  <span className="material-symbols-outlined text-[18px]">photo_camera</span>

    const predictTrainedForest = (features) => {
      const trees = TRAINED_ROAD_DEFECT_FOREST.trees;
      const classes = TRAINED_ROAD_DEFECT_FOREST.classes;
      const classScores = [0, 0, 0, 0];

      for (let t = 0; t < trees.length; t++) {
        const tree = trees[t];
        let curr = 0;
        while (!tree[curr].leaf) {
          if (features[tree[curr].feature] <= tree[curr].threshold) {
            curr = tree[curr].left;
          } else {
            curr = tree[curr].right;
          }
        }
        for (let c = 0; c < 4; c++) {
          classScores[c] += tree[curr].probs[c];
        }
      }

      const nTrees = trees.length;
      const probs = {};
      let bestClass = classes[0];
      let bestProb = -1;

      for (let c = 0; c < classes.length; c++) {
        const p = (classScores[c] / nTrees) * 100;
        probs[classes[c]] = Math.round(p * 10) / 10;
        if (p > bestProb) {
          bestProb = p;
          bestClass = classes[c];
        }
      }
      return { bestClass, probs };
    };

                    }
                    if (cy < 63 && cy < y1 - 1) {
                      cGrad += dy[cy * 64 + cx];
                      cGradCount++;
                    }
                  }
                }

                cellMeans.push(cLum / cellCount);
                cellRoughs.push(cGradCount > 0 ? cGrad / cGradCount : 0);
                cellWaters.push(cWater / cellCount);
                cellDarks.push(cDark / cellCount);
              }
            }

            // Spatial and topological statistics
            const bottomWaterCoverage = (cellWaters[6] + cellWaters[7] + cellWaters[8]) / 3.0;
            let totalWaterCells = 0;
            for (let i = 0; i < 9; i++) {
              if (cellWaters[i] > 0.25) totalWaterCells++;
            }

            let minCellLum = cellMeans[0], maxCellLum = cellMeans[0];
            let minRough = cellRoughs[0], maxRough = cellRoughs[0], sumRough = 0;
            let maxDarkCell = cellDarks[0];

            for (let i = 0; i < 9; i++) {
              if (cellMeans[i] < minCellLum) minCellLum = cellMeans[i];
              if (cellMeans[i] > maxCellLum) maxCellLum = cellMeans[i];
              if (cellRoughs[i] < minRough) minRough = cellRoughs[i];
              if (cellRoughs[i] > maxRough) maxRough = cellRoughs[i];
              sumRough += cellRoughs[i];
              if (cellDarks[i] > maxDarkCell) maxDarkCell = cellDarks[i];
            }
            const lumSpread = maxCellLum - minCellLum;
            const roughSpread = maxRough - minRough;
            const avgRough = sumRough / 9.0;

            // Concentric circle statistics (radial contrast)
            let innerSum = 0, innerCount = 0;
            let ringSum = 0, ringCount = 0;
            let outerSum = 0, outerCount = 0;

            for (let y = 0; y < 64; y++) {
              for (let x = 0; x < 64; x++) {
                const d = Math.sqrt((x - 32) * (x - 32) + (y - 32) * (y - 32));
                const val = gray[y * 64 + x];
                if (d < 10) {
                  innerSum += val; innerCount++;
                } else if (d >= 12 && d <= 24) {
                  ringSum += val; ringCount++;
                } else if (d > 26 && d <= 32) {
                  outerSum += val; outerCount++;
                }
              }
            }

            const innerMean = innerCount > 0 ? innerSum / innerCount : 0;
            const ringMean = ringCount > 0 ? ringSum / ringCount : 0;
            const outerMean = outerCount > 0 ? outerSum / outerCount : 0;

            const ringContrast = Math.abs(ringMean - outerMean);
            const centerContrast = Math.abs(innerMean - ringMean);
            const circularIndex = ringContrast + centerContrast;
            const rimStep = Math.abs(innerMean - outerMean);

            // Detrended 2D Autocorrelation for Grid Structures (Manhole Covers / Slotted Grates)
            const rowProf = new Float32Array(64);
            const colProf = new Float32Array(64);
            const rowSmooth = new Float32Array(64);
            const colSmooth = new Float32Array(64);

            for (let y = 0; y < 64; y++) {
              let rSum = 0;
              for (let x = 0; x < 64; x++) rSum += gray[y * 64 + x];
              rowProf[y] = rSum / 64.0;
            }
            for (let x = 0; x < 64; x++) {
              let cSum = 0;
              for (let y = 0; y < 64; y++) cSum += gray[y * 64 + x];
              colProf[x] = cSum / 64.0;
            }

            for (let i = 0; i < 64; i++) {
              let rSm = 0, cSm = 0, cnt = 0;
              for (let k = -4; k <= 4; k++) {
                const idx = i + k;
                if (idx >= 0 && idx < 64) {
                  rSm += rowProf[idx];
                  cSm += colProf[idx];
                  cnt++;
                }
              }
              rowSmooth[i] = rSm / cnt;
              colSmooth[i] = cSm / cnt;
            }

            for (let i = 0; i < 64; i++) {
              rowProf[i] -= rowSmooth[i];
              colProf[i] -= colSmooth[i];
            }

            const calcAutocorr = (prof) => {
              let mean = 0;
              for (let i = 0; i < 64; i++) mean += prof[i];
              mean /= 64.0;
              let variance = 0;
              for (let i = 0; i < 64; i++) variance += (prof[i] - mean) * (prof[i] - mean);
              if (variance < 1e-4) return 0;

              let maxCorr = 0;
              for (let lag = 4; lag <= 16; lag++) {
                let cov = 0, varA = 0, varB = 0;
                const n = 64 - lag;
                for (let i = 0; i < n; i++) {
                  const diffA = prof[i] - mean;
                  const diffB = prof[i + lag] - mean;
                  cov += diffA * diffB;
                  varA += diffA * diffA;
                  varB += diffB * diffB;
                }
                const denom = Math.sqrt(varA * varB);
                if (denom > 1e-6) {
                  const corr = cov / denom;
                  if (corr > maxCorr) maxCorr = corr;
                }
              }
              return maxCorr;
            };
            const gridScore = (calcAutocorr(rowProf) + calcAutocorr(colProf)) / 2.0;
            const rbRatio = sumR / (sumB + 1e-5);

            // 55 Spatial Pyramid Features Vector
            const features = [
              ...cellMeans, ...cellRoughs, ...cellWaters, ...cellDarks,
              bottomWaterCoverage, totalWaterCells, lumSpread,
              maxRough, minRough, roughSpread, avgRough, maxDarkCell,
              circularIndex, ringContrast, centerContrast, rimStep,
              innerMean, ringMean, outerMean,
              gridScore, grad, linRatio, rbRatio
            ];

            // Run Trained Decision Tree Ensemble
            const { bestClass, probs } = predictTrainedForest(features);

            let topClass = bestClass;
            let isShaftHazard = false;
            let detectedHazard = false;
            let waterOccluded = false;
            let detectedSubtype = 'Sheet Pooling';

            // Open Manhole Shaft Fall Hazard check:
            if (topClass === 'Manhole Collar') {
              if ((innerMean < 65.0 && (circularIndex >= 14.0 || ringContrast >= 7.0 || rimStep >= 25.0)) || maxDarkCell > 0.35) {
                isShaftHazard = true;
                detectedHazard = true;
              }
            }

            // Shoulder Distress refinement if crack is along edge:
            if (topClass === 'Crack') {
              if (linRatio >= 0.35 || cellRoughs[8] > cellRoughs[0] + 5.0) {
                topClass = 'Shoulder Distress';
              }
            }

            // Waterlogging sub-type determination:
            if (topClass === 'Waterlogging') {
              if (rbRatio > 1.45 && grad > 11.0) {
                detectedSubtype = 'Roadside / Shoulder Spillover';
              } else if (innerMean < 75.0 || (outerMean - innerMean > 3.0)) {
                detectedSubtype = 'Low-Point Ponding';
              } else if (linRatio > 0.25) {
                detectedSubtype = 'Drain-Overflow Flooding';
              } else {
                detectedSubtype = 'Sheet Pooling';
              }
              if (roughSpread > 14.0 || (detectedSubtype === 'Low-Point Ponding' && grad > 12.0)) {
                detectedHazard = true;
              }
            }

            // Pothole water occlusion check:
            if (topClass === 'Pothole') {
              if (bottomWaterCoverage > 0.25 || (specularCount / 4096.0 > 0.015 && rimStep >= 7.0)) {
                waterOccluded = true;
              }
            }

            const calibratedProbs = {
              'Pothole': probs['Pothole'] || 5.0,
              'Crack': probs['Crack'] || 5.0,
              'Shoulder Distress': topClass === 'Shoulder Distress' ? (probs['Crack'] || 90.0) : Math.min(probs['Crack'] || 5.0, 25.0),
              'Manhole Collar': probs['Manhole Collar'] || 5.0,
              'Waterlogging': probs['Waterlogging'] || 5.0
            };
            if (topClass === 'Shoulder Distress') {
              calibratedProbs['Shoulder Distress'] = Math.max(calibratedProbs['Shoulder Distress'], 88.5);
            }

            // Check if road is fully repaired / intact with NO active defect
            let isRepairedRoad = false;
            let repairedReason = '';
            if (!isNonRoad) {
              // A repaired road has good asphalt texture, but low roughness spread, flat elevation, no cavity, no ponding
              const isSmoothPavement = (roughSpread < 8.5 && rimStep < 6.0 && circularIndex < 5.0 && bottomWaterCoverage < 0.10 && gridScore < 0.28 && !isShaftHazard);
              const hasLowDefectConfidence = (topClass === 'Pothole' && rimStep < 6.5 && innerMean >= 75.0 && bottomWaterCoverage < 0.08);
              if (isSmoothPavement && (hasLowDefectConfidence || grad < 6.8)) {
                isRepairedRoad = true;
                repairedReason = 'Image shows an intact, smooth, or already repaired roadway surface. No active pothole cavity, waterlogging, or crack detected.';
              }
            }

            resolve({
              topClass,
              waterOccluded,
              rimStep,
              waterlogSubType: detectedSubtype,
              isSubmergedHazard: detectedHazard,
              isManholeShaftHazard: isShaftHazard,
              isNonRoad,
              nonRoadReason,
              isRepairedRoad,
              repairedReason,
              grad,
              meanLum,
              probs: calibratedProbs
            });
          } catch (err) {
            console.error("Analysis error:", err);
            resolve({
              topClass: 'Pothole',
              waterOccluded: false,
              rimStep: 28.5,
              waterlogSubType: 'Sheet Pooling',
              isSubmergedHazard: false,
              isManholeShaftHazard: false,
              isNonRoad: false,
              nonRoadReason: '',
              isRepairedRoad: false,

              probs: { 'Pothole': 68.2, 'Crack': 14.1, 'Shoulder Distress': 8.5, 'Manhole Collar': 5.2, 'Waterlogging': 4.0 }
            });
          }
        };
        img.onerror = () => {
          resolve({

            waterOccluded: false,

      });

            const compressImage = (url) => new Promise((resolve) => {
              const img = new Image();
              img.onload = () => {
                const maxDim = 960;
                let w = img.width;
                let h = img.height;
                if (w > maxDim || h > maxDim) {
                  if (w > h) {
                    h = Math.round((h * maxDim) / w);
                    w = maxDim;
                  } else {
                    w = Math.round((w * maxDim) / h);
                    h = maxDim;
                  }
                }
                const c = document.createElement('canvas');
                c.width = w;
                c.height = h;
                const ctx = c.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                resolve(c.toDataURL('image/jpeg', 0.82));
              };
              img.onerror = () => resolve(url);
              img.src = url;

          status: isHazard ? 'Safety Flag: Inspect Bed' : (isWaterlogging ? 'Drainage Work Order' : 'Sign-off Ready'),
          depth: depthVal,
          reportedTime: 'Just now',
          repairedTime: isHazard ? 'Emergency Inspection Dispatched' : 'Pending Dispatch',
          repairType: isHazard ? 'Emergency Dewatering & Post-Drainage Bed Void Scan' : (isWaterlogging ? 'High-Pressure Catch Basin Jetting & Culvert Clearance' : 'Hot-mix Asphalt Patch'),
          homographyConfidence: confStr,
          anchorsLocked: '3/3 Anchors Locked',
          beforeImage: newIncident.beforeImage,
          afterImage: newIncident.afterImage || newIncident.beforeImage,
          confidence: confNum,
          telemetry: docketTelemetry,
          hash: newIncident.ledgerHash || ('#e7a4f' + Math.random().toString(16).substring(2, 10) + '...9f01'),
          anchors: [
            { x1: 28, y1: 38, x2: 30, y2: 36, label: "Kerb Edge" },
            { x1: 66, y1: 26, x2: 64, y2: 24, label: "Sign Pole" },
            { x1: 82, y1: 52, x2: 78, y2: 48, label: "Joint Seam" }
          ]
        };
        setDocketsList(prev => [newDocket, ...prev]);

        // C. Prepend to Neighborhood Live Feed
        const newFeed = {
          id: newIncident.id,
          type: 'verified',
          badge: 'Reported & Verified',
          timeAgo: 'Just now',
          title: newIncident.title,
          address: newIncident.address,
          beforeImage: newIncident.beforeImage,
          afterImage: newIncident.afterImage,
          confidence: newIncident.confidence || 97.8,
          status: newIncident.status,
          metrics: newIncident.metrics,
          timeline: newIncident.timeline
        };
        setFeedItems(prev => [newFeed, ...prev]);

        // D. Create new Audit Block
        const newBlock = {
          block: 1430 + auditBlocks.length,
          hash: '9a' + Math.random().toString(16).substring(2, 10) + '...b91',
          event: 'CITIZEN_REPORT_SUBMIT',
          actor: 'Elena Vasquez (Citizen ID-42)',
          docket: '#' + newIncident.id,
          time: 'Just now',
          status: 'VALIDATED',
          zkp: 'Mobile Attestation Valid'
        };
        setAuditBlocks(prev => [newBlock, ...prev]);

        triggerAlert(`⚡ LIVE SYNC: Report #${newIncident.id} routed to Municipal Triage & dispatched to Contractor Rajesh Shinde!`);
      };

      // ── 2. Contractor Submits Proof (Reflects in Municipal Review & Citizen Timeline) ──
      const handleContractorSubmitProof = (jobId, proofData) => {
        const afterImg = proofData.capturedImage || "./demo_samples/s01_p01_after.jpg";

        // A. Update Contractor Jobs
        setContractorJobs(prev => prev.map(j => {
          if (j.id === jobId || j.complaintId === jobId || ('#' + j.complaintId) === jobId || ('WO-' + jobId.replace(/[^0-9]/g, '')) === j.id) {
            return {
              ...j,
              status: 'VERIFIED & COMPLETED',
              repairedPhoto: afterImg,
              verifiedAt: 'Just now'
            };
          }
          return j;
        }));

        // B. Update Municipal Review Queue with proof & high match score
        setDocketsList(prev => prev.map(d => {
          if (d.id === jobId || d.rawId === jobId || d.id === ('#' + jobId) || ('WO-' + d.rawId.replace(/[^0-9]/g, '')) === jobId || jobId.includes(d.rawId)) {
            return {
              ...d,
              status: 'AI-Verified: Ready for Escrow Release',
              afterImage: afterImg,
              matchScore: proofData.score || '98.4% Match',
              matchColor: 'emerald',
              timeRepaired: 'Just now'
            };
          }
          return d;
        }));

        // C. Update Citizen Reports, Neighborhood Feed, & Active Incident
        const updateInc = (inc) => {
          if (inc.id === jobId || ('#' + inc.id) === jobId || ('WO-' + inc.id.replace(/[^0-9]/g, '')) === jobId || jobId.includes(inc.id)) {
            const updatedTimeline = (inc.timeline || []).map(item => {
              if (item.title.includes('Contractor Repaired')) return { ...item, completed: true, date: 'Just now • Repaired by Apex Crew #4' };
              if (item.title.includes('AI Telemetry Verified')) return { ...item, completed: true, date: 'Just now • 98.4% Homography Match' };
              return item;
            });
            return {
              ...inc,
              status: 'Contractor Repaired & AI-Verified',
              statusType: 'verified',
              repairedDate: 'Just now by Apex Crew #4',
              afterImage: afterImg,
              timeline: updatedTimeline
            };
          }
          return inc;
        };
        setUserReports(prev => prev.map(updateInc));
        setFeedItems(prev => prev.map(updateInc));
        setSelectedIncident(prev => prev ? updateInc(prev) : prev);

        // D. Create Audit Block
        const newBlock = {
          block: 1430 + auditBlocks.length,
          hash: '3d' + Math.random().toString(16).substring(2, 10) + '...f01',
          event: 'CONTRACTOR_PROOF_SUBMIT',
          actor: 'Apex Paving (Rajesh Shinde)',
          docket: jobId.startsWith('#') ? jobId : '#' + jobId,
          time: 'Just now',
          status: 'VALIDATED',
          zkp: 'Keypoints 3/3 Locked • Depth 100%'
        };
        setAuditBlocks(prev => [newBlock, ...prev]);

        triggerAlert(`⚡ LIVE SYNC: Repair proof uploaded for ${jobId}! Dual evidence ready in Municipal Portal.`);
      };

      // ── 3. Municipal Officer Approves Docket (Payout Released & Citizen Ticket Closed) ──
      const handleMunicipalApprove = (docketId) => {
        // A. Update Municipal Queue
        setDocketsList(prev => prev.map(d => (d.id === docketId || d.rawId === docketId) ? { ...d, status: 'Approved', matchColor: 'emerald' } : d));

        // B. Mark Contractor Job Paid & Closed
        setContractorJobs(prev => prev.map(j => {
          if (j.id === docketId || ('#' + j.complaintId) === docketId || j.complaintId === docketId || docketId.includes(j.complaintId)) {
            return { ...j, status: 'PAID & CLOSED' };
          }
          return j;
        }));

        // C. Pay Contractor Rajesh Shinde (Payout Total and completed jobs increment)
        setContractorsList(prev => prev.map(c => {
          if (c.id === 'APEX-01' || c.lead.includes('Rajesh')) {
            const currentNum = parseInt(c.payoutTotal.replace(/[^0-9]/g, ''), 10) || 1480000;
            return {
              ...c,
              completed: c.completed + 1,
              payoutTotal: '₹' + (currentNum + 12000).toLocaleString('en-IN')
            };
          }
          return c;
        }));

        // D. Mark Citizen Ticket Closed & Escrow Disbursed
        const closeInc = (inc) => {
          if (inc.id === docketId || ('#' + inc.id) === docketId || docketId.includes(inc.id)) {
            const updatedTimeline = (inc.timeline || []).map(item => {
              if (item.title.includes('Contractor Repaired')) return { ...item, completed: true };
              if (item.title.includes('AI Telemetry Verified')) return { ...item, completed: true };
              if (item.title.includes('Community Confirmation') || item.title.includes('Ticket Closed')) {
                return { ...item, completed: true, date: 'Closed • Escrow Disbursed' };
              }
              return item;
            });
            return {
              ...inc,
              status: 'Case Resolved & Escrow Disbursed',
              statusType: 'completed',
              timeline: updatedTimeline
            };
          }
          return inc;
        };
        setUserReports(prev => prev.map(closeInc));
        setFeedItems(prev => prev.map(closeInc));
        setSelectedIncident(prev => prev ? closeInc(prev) : prev);

        // E. Audit Block
        const newBlock = {
          block: 1430 + auditBlocks.length,
          hash: 'e7' + Math.random().toString(16).substring(2, 10) + '...a01',
          event: 'OFFICER_SIGN_OFF',
          actor: 'Elena Rostova (Municipal Engineer ID-84)',
          docket: docketId.startsWith('#') ? docketId : '#' + docketId,
          time: 'Just now',
          status: 'VALIDATED',
          zkp: 'Escrow Released to Apex Paving (₹12,000)'
        };
        setAuditBlocks(prev => [newBlock, ...prev]);

        triggerAlert(`⚡ LIVE SYNC: Officer signed off ${docketId}! ₹12,000 released to Rajesh Shinde & Citizen ticket closed.`);
      };

      // ── 4. Municipal Officer Rework / Reject ──
      const handleMunicipalReject = (docketId) => {
        setDocketsList(prev => prev.map(d => (d.id === docketId || d.rawId === docketId) ? { ...d, status: 'Rework Required', matchColor: 'red' } : d));

        setContractorJobs(prev => prev.map(j => {
          if (j.id === docketId || ('#' + j.complaintId) === docketId || j.complaintId === docketId || docketId.includes(j.complaintId)) {
            return { ...j, status: 'REWORK REQUIRED', priority: 'CRITICAL' };
          }
          return j;
        }));

        triggerAlert(`⚡ LIVE SYNC: Rework order dispatched for ${docketId}! Contractor Rajesh Shinde terminal notified.`);
      };

      if (!currentUser || activeScreen === 'login') {
        return (
          <MobileAppShell activeRole="citizen" onSwitchRole={switchRoleQuickly} liveAlert={liveAlert}>
            <div className="flex-1 w-full overflow-y-auto no-scrollbar flex flex-col justify-center">
              <LoginPage
                onLogin={handleLogin}
                lang={lang}
                setLang={setLang}
                t={t}
              />
            </div>
          </MobileAppShell>
        );
      }

      const isContractor = currentUser.role === 'contractor';
      const isOfficer = currentUser.role === 'officer';

      // 1. MUNICIPAL OFFICER: Full-Screen Desktop Web Dashboard
      if (isOfficer) {
        return (
          <div className="min-h-screen w-full bg-[#f4f7f4] text-[#151d19] font-['Inter'] antialiased">
            <MunicipalPortal
              onLogout={handleLogout}
              lang={lang}
              setLang={setLang}
              t={t}
              onSwitchRole={switchRoleQuickly}
              docketsList={docketsList}
              setDocketsList={setDocketsList}
              onApproveDocket={handleMunicipalApprove}
              onRejectDocket={handleMunicipalReject}
              auditBlocks={auditBlocks}
              setAuditBlocks={setAuditBlocks}
              contractorsList={contractorsList}
              setContractorsList={setContractorsList}
              liveAlert={liveAlert}
            />
          </div>
        );
      }

      // 2. CITIZEN & CONTRACTOR: 100% Native Mobile App Experience
      return (
        <MobileAppShell
          activeRole={currentUser.role}
          onSwitchRole={switchRoleQuickly}
          liveAlert={liveAlert}
        >
          {/* CITIZEN APP */}
          {!isContractor && (
            <>
              <Header
                activeScreen={activeScreen}
                setActiveScreen={setActiveScreen}
                lang={lang}
                setLang={setLang}
                selectedWard={selectedWard}
                setSelectedWard={setSelectedWard}
                onLogout={handleLogout}
                t={t}
              />
              <main className="flex-1 w-full overflow-y-auto no-scrollbar px-4 pt-2 pb-20 flex flex-col">
                {activeScreen === 'home' && (
                  <CivicHome
                    setActiveScreen={setActiveScreen}
                    setSelectedIncident={setSelectedIncident}
                    selectedWard={selectedWard}
                    t={t}
                    userReports={userReports}
                    feedItems={feedItems}
                  />
                )}
                {activeScreen === 'report' && (
                  <ReportCamera
                    setActiveScreen={setActiveScreen}
                    addNewReport={addNewReport}
                    selectedWard={selectedWard}
                    t={t}
                    userReports={userReports}
                    feedItems={feedItems}
                  />
                )}
                {activeScreen === 'detail' && (
                  <ComplaintDetail
                    incident={selectedIncident}
                    setActiveScreen={setActiveScreen}
                    t={t}
                  />
                )}
                {activeScreen === 'my-reports' && (
                  <MyReports
                    userReports={userReports}
                    setActiveScreen={setActiveScreen}
                    setSelectedIncident={setSelectedIncident}
                    t={t}
                  />
                )}
                {activeScreen === 'activity' && (
                  <CivicActivity
                    setActiveScreen={setActiveScreen}
                    setSelectedIncident={setSelectedIncident}
                    selectedWard={selectedWard}
                    t={t}
                  />
                )}
                {activeScreen === 'community-map' && (
                  <CommunityMap
                    setActiveScreen={setActiveScreen}
                    setSelectedIncident={setSelectedIncident}
                    selectedWard={selectedWard}
                    t={t}
                  />
                )}
              </main>
              {activeScreen !== 'report' && <BottomNav activeScreen={activeScreen} setActiveScreen={setActiveScreen} t={t} />}
            </>
          )}

          {/* CONTRACTOR APP */}
          {isContractor && (
            <>
              <main className="flex-1 w-full overflow-y-auto no-scrollbar px-3 pt-2 pb-20 flex flex-col">
                {activeScreen === 'contractor-jobs' && (
                  <ContractorJobFeed
                    jobs={contractorJobs}
                    onSelectJob={setSelectedJob}
                    setActiveScreen={setActiveScreen}
                    onLogout={handleLogout}
                    lang={lang}
                    setLang={setLang}
                    t={t}
                  />
                )}
                {activeScreen === 'contractor-camera' && (
                  <GhostOverlayCamera
                    job={selectedJob}
                    onSubmitProof={handleContractorSubmitProof}
                    setActiveScreen={setActiveScreen}
                    t={t}
                  />
                )}
                {activeScreen === 'contractor-scorecard' && (
                  <ContractorScorecard
                    onLogout={handleLogout}
                    lang={lang}
                    setLang={setLang}
                    t={t}
                  />
                )}
              </main>
              {activeScreen !== 'contractor-camera' && (
                <ContractorBottomNav
                  activeScreen={activeScreen}
                  setActiveScreen={setActiveScreen}
                  t={t}
                />
              )}
            </>
          )}
        </MobileAppShell>
      );
    }

        class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("CivicFix Runtime Error caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen w-full bg-[#f4f7f4] flex flex-col items-center justify-center p-6 text-[#151d19]">
              <div className="max-w-md w-full p-6 rounded-3xl bg-white border border-[#d7e8c3] shadow-lg flex flex-col items-center text-center gap-4">
                <div className="w-12 h-12 rounded-full bg-[#ffdad6] text-[#ba1a1a] flex items-center justify-center">
                  <span className="material-symbols-outlined text-[28px]">warning</span>
                </div>
                <h3 className="font-['Plus_Jakarta_Sans'] font-extrabold text-[18px]">Temporary Interface Refresh Required</h3>
                <p className="text-[13px] text-[#546346]">A component encountered an issue rendering data. Click below to recover the dashboard with clean state.</p>
                <button
                  onClick={() => {
                    localStorage.removeItem('civicfix_dockets');
                    window.location.reload();
                  }}
                  className="w-full py-3 rounded-full bg-[#0d631b] hover:bg-[#2e7d32] text-white font-['Plus_Jakarta_Sans'] font-bold text-[14px] transition-all cursor-pointer"
                >
                  Reload Dashboard
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
